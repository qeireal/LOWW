name: Build

# Release bundles for every commit on main. Pull requests run the same build to catch breakage before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            platform: macos-universal
            configure: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows x64
            os: windows-2022
            platform: windows-x64
            configure: -G "Visual Studio 17 2022" -A x64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux-x64
            configure: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The tests create the editor, so Linux needs a virtual display.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Check universal binaries
        if: runner.os == 'macOS'
        run: |
          for binary in Standalone/LOWW.app/Contents/MacOS/LOWW VST3/LOWW.vst3/Contents/MacOS/LOWW AU/LOWW.component/Contents/MacOS/LOWW; do
            lipo "build/LOWW_artefacts/Release/$binary" -verify_arch arm64 x86_64
          done

      # Archive before upload: artifact uploads drop symlinks and executable bits that bundles rely on.
      - name: Package
        shell: bash
        run: |
          name="LOWW-${{ matrix.platform }}-${GITHUB_SHA::7}"
          mkdir -p "dist-ci/$name"
          artefacts=build/LOWW_artefacts/Release
          case "$RUNNER_OS" in
            macOS)
              cp -R "$artefacts/Standalone/LOWW.app" "$artefacts/VST3/LOWW.vst3" "$artefacts/AU/LOWW.component" "dist-ci/$name/"
              (cd dist-ci && ditto -c -k --keepParent "$name" "$name.zip") ;;
            Windows)
              cp -R "$artefacts/Standalone/LOWW.exe" "$artefacts/VST3/LOWW.vst3" "dist-ci/$name/"
              (cd dist-ci && 7z a -tzip "$name.zip" "$name" > /dev/null) ;;
            Linux)
              cp -R "$artefacts/Standalone/LOWW" "$artefacts/VST3/LOWW.vst3" "dist-ci/$name/"
              tar -C dist-ci -czf "dist-ci/$name.tar.gz" "$name" ;;
          esac
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist-ci/${{ env.ARCHIVE_NAME }}.*
          if-no-files-found: error
          retention-days: 30
